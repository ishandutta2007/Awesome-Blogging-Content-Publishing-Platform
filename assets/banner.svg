<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1138" />
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#a855f7;#ec4899;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#ec4899;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
      <circle cx="40" cy="40" r="1" fill="rgba(56, 189, 248, 0.15)" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #e2e8f0;
    }
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      fill: #38bdf8;
    }
  </style>

  <!-- Background base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#gridPattern)" />

  <!-- Animated Glowing Orbs (Dynamic Aspect in background) -->
  <g opacity="0.45" filter="url(#glow)">
    <circle cx="200" cy="150" r="130" fill="#0284c7">
      <animate attributeName="cx" values="200;280;160;200" dur="14s" repeatCount="indefinite" />
      <animate attributeName="cy" values="150;100;180;150" dur="14s" repeatCount="indefinite" />
      <animate attributeName="r" values="130;160;120;130" dur="14s" repeatCount="indefinite" />
    </circle>
    <circle cx="950" cy="240" r="150" fill="#7c3aed">
      <animate attributeName="cx" values="950;880;1000;950" dur="16s" repeatCount="indefinite" />
      <animate attributeName="cy" values="240;290;190;240" dur="16s" repeatCount="indefinite" />
      <animate attributeName="r" values="150;180;130;150" dur="16s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="360" r="110" fill="#db2777">
      <animate attributeName="cx" values="600;660;540;600" dur="12s" repeatCount="indefinite" />
      <animate attributeName="cy" values="360;320;380;360" dur="12s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Floating animated data flow lines (background) -->
  <g stroke-linecap="round" opacity="0.3">
    <path d="M 50 100 Q 300 40 600 100 T 1150 100" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="12 16">
      <animate attributeName="stroke-dashoffset" values="0;-200" dur="10s" repeatCount="indefinite" />
    </path>
    <path d="M 50 320 Q 350 380 650 320 T 1150 320" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="10 14">
      <animate attributeName="stroke-dashoffset" values="0;200" dur="12s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Foreground Content Container: Title and subtitle are crisp and strictly in foreground -->
  <g transform="translate(60, 50)">
    
    <!-- Category Pill -->
    <g transform="translate(0, 10)">
      <rect width="210" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
      <circle cx="16" cy="16" r="5" fill="#38bdf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="21" class="badge-label">Curated Architecture</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="95" class="title" fill="url(#titleGrad)">Awesome Blogging &amp; Publishing</text>

    <!-- Subtitle -->
    <text x="0" y="140" class="subtitle">Modern Content Publishing Platforms, Headless CMSs &amp; Newsletter Infrastructure</text>

    <!-- Interactive / Status Pills in foreground -->
    <g transform="translate(0, 185)">
      <!-- Pill 1: Headless CMS -->
      <g transform="translate(0, 0)">
        <rect width="180" height="42" rx="10" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1" />
        <text x="24" y="26" class="pill-text">🚀 Headless CMS</text>
      </g>
      <!-- Pill 2: Self-Hosted -->
      <g transform="translate(195, 0)">
        <rect width="180" height="42" rx="10" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1" />
        <text x="24" y="26" class="pill-text">⚡ Self-Hosted</text>
      </g>
      <!-- Pill 3: Newsletters -->
      <g transform="translate(390, 0)">
        <rect width="190" height="42" rx="10" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1" />
        <text x="24" y="26" class="pill-text">📬 Newsletters &amp; Sub</text>
      </g>
      <!-- Pill 4: Open Source -->
      <g transform="translate(595, 0)">
        <rect width="180" height="42" rx="10" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1" />
        <text x="24" y="26" class="pill-text">✨ Open-Source First</text>
      </g>
      <!-- Pill 5: Static Generators -->
      <g transform="translate(790, 0)">
        <rect width="190" height="42" rx="10" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1" />
        <text x="24" y="26" class="pill-text">📝 Markdown-Native</text>
      </g>
    </g>

    <!-- Secondary info tag line -->
    <g transform="translate(0, 265)">
      <text x="2" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" font-weight="500">
        Enterprise SaaS, Developer Headless Frameworks, Independent Creator Newsletters &amp; Federated ActivityPub Engines
      </text>
    </g>

  </g>

  <!-- Outer frame border -->
  <rect x="0.5" y="0.5" width="1199" height="419" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
</svg>
